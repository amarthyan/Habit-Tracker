<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Habit Tracker — Free Online Habit Tracker & Goal Dashboard</title>
  
  <meta name="description" content="Free online habit tracker web app. Build daily routines, track monthly habits with a spreadsheet dashboard, view consistency analytics, and export to PDF/Excel." />
  <meta name="keywords" content="habit tracker, habit, habits, daily habit tracker, online habit tracker, monthly habit tracker, track habits, habit building, goal tracker, productivity" />
  <meta name="author" content="Amarthyan" />
  <meta property="og:title" content="Habit Tracker — Free Online Habit Tracker & Goal Dashboard" />
  <meta property="og:description" content="Build positive routines and track your daily habits with a clean, spreadsheet-style habit dashboard and analytics." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nalla-sheelam.vercel.app" />
  <link rel="canonical" href="https://nalla-sheelam.vercel.app" />
  
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Pre-render Dark Mode script to avoid UI flash -->
  <script>
    if (localStorage.getItem("habit-dark") === "1") {
      document.documentElement.classList.add("dark");
    }
  </script>

  <!-- External Libraries for Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- App JS -->
  <script src="app.js" defer></script>
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header Navigation & Theme switch -->
    <header class="app-header">
      <div class="header-top">
        <div class="button-group">
          <!-- PDF Export Button -->
          <button id="btn-export-pdf" class="btn btn-outline btn-sm" aria-label="Export to PDF">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
              <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
              <path d="M8 18h8"/>
              <path d="M8 14h8"/>
              <path d="M8 10h4"/>
            </svg> PDF
          </button>
          
          <!-- Excel Export Button -->
          <button id="btn-export-excel" class="btn btn-outline btn-sm" aria-label="Export to Excel">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
              <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
              <path d="M8 13h2"/>
              <path d="M14 13h2"/>
              <path d="M8 17h2"/>
              <path d="M14 17h2"/>
            </svg> Excel
          </button>
        </div>
        
        <!-- Theme Toggle Button -->
        <button id="btn-theme-toggle" class="btn btn-outline btn-icon" aria-label="Toggle Theme">
          <!-- Light icon default: Will be populated dynamically by app.js on load -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2"/>
            <path d="M12 20v2"/>
            <path d="m4.93 4.93 1.41 1.41"/>
            <path d="m17.66 17.66 1.41 1.41"/>
            <path d="M2 12h2"/>
            <path d="M20 12h2"/>
            <path d="m6.34 17.66-1.41 1.41"/>
            <path d="m19.07 4.93-1.41 1.41"/>
          </svg>
        </button>
      </div>
      
      <!-- App title -->
      <h1>Habit Tracker</h1>
      
      <!-- Year navigation -->
      <div class="year-selector">
        <button id="btn-prev-year" class="btn btn-outline btn-icon" aria-label="Previous Year">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </button>
        <div id="year-display" class="year-display">2026</div>
        <button id="btn-next-year" class="btn btn-outline btn-icon" aria-label="Next Year">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </button>
      </div>
      
      <!-- Month Navigation Tab Bar -->
      <div id="month-tabs-container" class="month-tabs"></div>
      
      <!-- Completion Summary Text -->
      <p id="month-summary-text" class="month-summary"></p>
    </header>
    
    <!-- Dashboard Core Grid Container -->
    <main class="dashboard-grid">
      
      <!-- Habit Sheet Table Card (Left) -->
      <section class="card card-padding" aria-label="Habits Grid">
        <div id="habit-grid-wrapper" class="grid-container"></div>
      </section>
      
      <!-- Goals Sidebar Panel (Right) -->
      <aside class="card card-padding" aria-label="Goals and Progress">
        <h2>Goals & Progress</h2>
        <div id="goals-panel-list" class="goals-list"></div>
      </aside>
      
    </main>
    
    <!-- Analytics cards section -->
    <section class="analytics-grid" aria-label="Monthly Analytics">
      
      <!-- Monthly Overview details -->
      <div class="card card-padding">
        <h2>Monthly Overview</h2>
        <div class="month-overview-content">
          <div id="monthly-chart-svg" class="chart-svg-container"></div>
          <div id="stats-grid-container" class="stats-grid"></div>
        </div>
      </div>
      
      <!-- Weekly progress chart list -->
      <div class="card card-padding">
        <h2>Weekly Completion</h2>
        <div id="weekly-progress-grid" class="weeks-grid"></div>
      </div>
      
    </section>
    
    <!-- Year Overview section -->
    <section class="card card-padding" style="margin-top: 2rem;" aria-label="Year Overview">
      <div class="year-overview-header">
        <h2>Year Overview</h2>
        <div id="year-summary-numbers" class="year-overview-stat"></div>
      </div>
      <div id="year-overview-grid-container" class="year-overview-grid"></div>
    </section>
    
  </div>
  
  <!-- Footer Watermark -->
  <footer id="amarthyan-watermark" class="watermark">
    Build by Amarthyan
  </footer>

</body>
</html>
